name: Deploy unified wiki to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the canonical wiki
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: python -m pip install mkdocs mkdocs-material

      - name: Stage the canonical Markdown tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir .pages-src
          find . -maxdepth 1 -type f -name '*.md' -exec cp '{}' .pages-src/ ';'
          cp Home.md .pages-src/index.md
          if [ -d images ]; then cp -R images .pages-src/; fi
          if [ -d YIME_Theory ]; then cp -R YIME_Theory .pages-src/; fi

      - name: Build Pages site
        run: mkdocs build --strict --config-file .pages/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
